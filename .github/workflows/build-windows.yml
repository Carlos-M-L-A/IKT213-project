name: Build app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: build-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            onedir_flag: -D
            artifact_name: windows-app
          - os: ubuntu-latest
            onedir_flag: -D
            artifact_name: linux-app
          - os: macos-latest
            onedir_flag: ""   # flet pack does not support onedir on macOS
            artifact_name: macos-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flet-cli flet-desktop

      - name: Package with flet pack
        run: |
          flet pack App/window.py ${{ matrix.onedir_flag }} -y --add-binary "App/include/face_detection_yunet_2023mar.onnx:App/include" --add-binary "Model/trueModel.pht.tar:Model" -- --clean --collect-all torch --collect-all torchvision --collect-all cv2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
